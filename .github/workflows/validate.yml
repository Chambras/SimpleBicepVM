name: Validate

on:
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  validate:
    name: Validate Bicep
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate deployment
        run: |
          az deployment sub validate \
            -n TestDev \
            -f deploy.bicep \
            -p @parameters.json \
            -p adminCreds=${{ secrets.ADMIN_PASSWORD }} \
               allowedRdpSourceAddress=${{ secrets.ALLOWED_RDP_SOURCE }} \
            -l eastus2 \
            -o table
