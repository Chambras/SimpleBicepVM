name: Cleanup

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  cleanup:
    name: Cleanup Resources
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve resource group name
        id: resolve-rg
        run: |
          rg_name=$(az deployment sub show -n TestDev --query "properties.outputs.RGName.value" -o tsv)
          echo "rg_name=$rg_name" >> "$GITHUB_OUTPUT"

      - name: Delete resource group
        run: |
          az group delete \
            -n "${{ steps.resolve-rg.outputs.rg_name }}" \
            --yes --no-wait

      - name: Delete subscription deployment
        run: |
          az deployment sub delete \
            -n TestDev
